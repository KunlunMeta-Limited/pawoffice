<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">对话回合与恢复流程</title><desc id="desc">React 通过 Office API 创建回合，Gateway 在后端合并 Host status、turns 和 message。</desc><defs><marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.b{fill:#fff;stroke:#334155;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.gray{fill:#f8fafc;stroke:#64748b;stroke-width:2}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.note{fill:#fefce8;stroke:#ca8a04;stroke-width:2}.t{font:14px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#0f172a}.h{font:700 24px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#0f172a}.s{font:12px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#334155}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}.ln{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a3)}.dash{stroke-dasharray:8 6}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="32" y="38" class="h">对话回合：前端只看 Office DTO，终态合并留在后端</text><rect x="80" y="60" width="170" height="60" class="blue"/><text x="165" y="97" text-anchor="middle" class="t">React</text><rect x="430" y="60" width="190" height="60" class="gray"/><text x="525" y="87" text-anchor="middle" class="t">Gateway</text><text x="525" y="108" text-anchor="middle" class="t">Office API v1</text><rect x="800" y="60" width="220" height="60" class="green"/><text x="910" y="87" text-anchor="middle" class="t">Rust Host</text><text x="910" y="108" text-anchor="middle" class="t">Office Engine Adapter</text><rect x="1190" y="60" width="220" height="60" class="orange"/><text x="1300" y="87" text-anchor="middle" class="t">Scheduler / AgentLoop</text><text x="1300" y="108" text-anchor="middle" class="t">Provider / Tools</text><path d="M165 120 L165 760" class="life"/><path d="M525 120 L525 760" class="life"/><path d="M910 120 L910 760" class="life"/><path d="M1300 120 L1300 760" class="life"/><path d="M165 170 L525 170" class="ln"/><text x="345" y="154" text-anchor="middle" class="s">1. POST turn + Idempotency-Key + text</text><path d="M525 240 L910 240" class="ln"/><text x="717" y="224" text-anchor="middle" class="s">2. adapter → prompt_async + requestID</text><path d="M910 310 L1300 310" class="ln"/><text x="1105" y="294" text-anchor="middle" class="s">3. admission / persist accepted</text><path d="M910 380 L525 380" class="ln dash"/><text x="717" y="364" text-anchor="middle" class="s">4. turnId + accepted/queued</text><path d="M525 430 L165 430" class="ln dash"/><text x="345" y="414" text-anchor="middle" class="s">5. 202 command ACK</text><path d="M165 500 L525 500" class="ln"/><text x="345" y="484" text-anchor="middle" class="s">6. GET turn projection</text><path d="M525 570 L910 570" class="ln"/><text x="717" y="546" text-anchor="middle" class="s">7. status + turns + message</text><text x="717" y="562" text-anchor="middle" class="s">在后端合并</text><path d="M910 640 L525 640" class="ln dash"/><text x="717" y="624" text-anchor="middle" class="s">8. queued/running 或持久终态</text><path d="M525 710 L165 710" class="ln dash"/><text x="345" y="686" text-anchor="middle" class="s">9. Office DTO</text><text x="345" y="702" text-anchor="middle" class="s">不暴露 userMessageID/内部事件</text><rect x="430" y="790" width="640" height="70" class="note"/><text x="750" y="820" text-anchor="middle" class="t">取消成功只表示已受理，继续查询到 completed / failed / cancelled。</text><text x="750" y="846" text-anchor="middle" class="t">动画是旁路投影，失败不改变回合结果。</text></svg>
