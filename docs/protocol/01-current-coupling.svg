<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">AI Office 当前耦合图</title><desc id="desc">React、Gateway、Rust Host、OpenPaw 私有存储和动作回调之间的当前耦合。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><style>.b{fill:#fff;stroke:#334155;stroke-width:2}.ui{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.bad{fill:#fff1f2;stroke:#dc2626;stroke-width:3}.host{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.store{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.t{font:14px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#0f172a}.h{font:700 24px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#0f172a}.s{font:12px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#334155}.ln{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.red{stroke:#dc2626;stroke-width:2.5;fill:none;marker-end:url(#r)}.dash{stroke-dasharray:8 6}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="32" y="42" class="h">当前实现：物理隔离存在，协议与存储仍高度耦合</text><rect x="40" y="250" width="260" height="120" class="ui"/><text x="170" y="282" text-anchor="middle" class="t">React UI</text><text x="170" y="306" text-anchor="middle" class="t">组件 + useConversationController</text><text x="170" y="330" text-anchor="middle" class="t">理解 turnID / 409 / 429</text><text x="170" y="354" text-anchor="middle" class="t">承担终态对账</text><rect x="390" y="200" width="300" height="210" class="bad"/><text x="540" y="234" text-anchor="middle" class="t">Node Gateway 单体 :8765</text><text x="540" y="263" text-anchor="middle" class="t">HTTP / Host Adapter</text><text x="540" y="292" text-anchor="middle" class="t">JSONL / goals / skills / workspace</text><text x="540" y="321" text-anchor="middle" class="t">任务编排 / 日历 / 通知 / OCR</text><text