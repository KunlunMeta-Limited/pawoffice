<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc"><title id="title">目标分层架构</title><desc id="desc">React 只依赖 Office API，Gateway 使用 ports 和 adapters，OpenCode 只服务 OpenWork。</desc><defs><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.box{fill:#fff;stroke:#334155;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.gray{fill:#f8fafc;stroke:#64748b;stroke-width:2}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.t{font:14px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#0f172a}.h{font:700 24px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#0f172a}.s{font:12px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#334155}.ln{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a2)}.dash{stroke-dasharray:8 6}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="32" y="42" class="h">目标架构：协议是边界，存储格式和运行时细节不出后端</text><rect x="40" y="260" width="190" height="90" class="blue"/><text x="135" y="297" text-anchor="middle" class="t">React Features</text><text x="135" y="323" text-anchor="middle" class="t">只处理 UI 状态</text><rect x="290" y="250" width="240" height="110" class="blue"/><text x="410" y="290" text-anchor="middle" class="t">Generated Office Client</text><text x="410" y="318" text-anchor="middle" class="t">Office API v1 DTO / Error</text><rect x="610" y="120" width="220" height="90" class="gray"/><text x="720" y="157" text-anchor="middle" class="t">Gateway Controllers</text><text x="720" y="183" text-anchor="middle" class="t">/api/office/v1</text><rect x="610" y="260" width="220" height="130" class="gray"/><text x="720" y="295" text-anchor="middle" class="t">Application Services</text><text x="720" y="322" text-anchor="middle" class="t">Conversation / Turn / Task</text><text x="720" y="349" text-anchor="middle" class="t">Approval / Resource</text><rect x="610" y="450" width="220" height="120" class="gray"/><text x="720" y="486" text-anchor="middle" class="t">Ports</text><text x="720" y="514" text-anchor="middle" class="t">HostClient / Repositories</text><text x="720" y="542" text-anchor="middle" class="t">Projection / OCR</text><rect x="920" y="250" width="240" height="120" class="green"/><text x="1040" y="286" text-anchor="middle" class="t">Office Engine API v1</text><text x="1040" y="314" text-anchor="middle" class="t">session / turn / approval</text><text x="1040" y="342" text-anchor="middle" class="t">版本化内部协议</text><rect x="1230" y="250" width="260" height="100" class="green"/><text x="1360" y="289" text-anchor="middle" class="t">Rust Host Domain</text><text x="1360" y="317" text-anchor="middle" class="t">Scheduler / AgentLoop / Recovery</text><rect x="1230" y="470" width="260" height="120" class="orange"/><text x="1360" y="506" text-anchor="middle" class="t">OpenPaw 私有存储</text><text x="1360" y="534" text-anchor="middle" class="t">JSONL / Goals / Skills</text><text x="1360" y="562" text-anchor="middle" class="t">格式不出边界</text><rect x="920" y="470" width="240" height="120" class="orange"/><text x="1040" y="506" text-anchor="middle" class="t">Storage Adapters</text><text x="1040" y="534" text-anchor="middle" class="t">过渡期可直读只读数据</text><text x="1040" y="562" text-anchor="middle" class="t">后续切 Host API</text><rect x="930" y="60" width="220" height="110" class="purple"/><text x="1040" y="96" text-anchor="middle" class="t">Semantic Event Stream</text><text x="1040" y="124" text-anchor="middle" class="t">tool.started / turn.finished</text><text x="1040" y="152" text-anchor="middle" class="t">不含 rosterNo</text><rect x="610" y="640" width="220" height="90" class="purple"/><text x="720" y="677" text-anchor="middle" class="t">Office Projection</text><text x="720" y="703" text-anchor="middle" class="t">名册 / 角色 / 动画策略</text><rect x="300" y="650" width="190" height="70" class="box"/><text x="395" y="692" text-anchor="middle" class="t">Pixi Scene</text><rect x="1250" y="60" width="150" height="55" class="box"/><text x="1325" y="94" text-anchor="middle" class="t">OpenWork</text><rect x="1230" y="145" width="190" height="55" class="box"/><text x="1325" y="179" text-anchor="middle" class="t">OpenCode Compat v1</text><path d="M230 305 L290 305" class="ln"/><text x="260" y="294" text-anchor="middle" class="s">Office v1</text><path d="M530 300 L610 165" class="ln"/><text x="574" y="224" class="s">HTTP</text><path d="M720 210 L720 260" class="ln"/><path d="M720 390 L720 450" class="ln"/><path d="M830 500 L920 320" class="ln"/><text x="864" y="408" class="s">adapter</text><path d="M1160 310 L1230 300" class="ln"/><path d="M1360 350 L1360 470" class="ln"/><path d="M830 530 L920 530" class="ln"/><path d="M1160 530 L1230 530" class="ln dash"/><text x="1195" y="519" text-anchor="middle" class="s">过渡期只读</text><path d="M1230 270 L1120 170" class="ln dash"/><path d="M930 115 L830 660" class="ln"/><text x="868" y="390" class="s">subscribe</text><path d="M610 685 L490 685" class="ln"/><path d="M1325 115 L1325 145" class="ln"/><path d="M1325 200 L1360 250" class="ln"/></svg>
