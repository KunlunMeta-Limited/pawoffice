<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">回合状态机与唯一终态</title><desc id="desc">AI Office / OpenPaw 架构图预览</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.box{fill:#fff;stroke:#334155;stroke-width:2}.soft{fill:#eff6ff;stroke:#2563eb}.warn{fill:#fff7ed;stroke:#ea580c}.ok{fill:#f0fdf4;stroke:#16a34a}.muted{fill:#f8fafc;stroke:#64748b}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.h{font:700 22px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="38" class="h">回合状态机与唯一终态</text><rect x="70" y="240" width="130" height="60" rx="4" class="soft"/><text x="135" y="270" text-anchor="middle" class="t">接收请求</text><rect x="300" y="130" width="150" height="75" rx="4" class="warn"/><text x="375" y="167.5" text-anchor="middle" class="t">Queued</text><rect x="300" y="330" width="150" height="75" rx="4" class="soft"/><text x="375" y="367.5" text-anchor="middle" class="t">Running</text><rect x="620" y="100" width="170" height="75" rx="4" class="ok"/><text x="705" y="137.5" text-anchor="middle" class="t">Completed</text><rect x="620" y="250" width="170" height="75" rx="4" class="warn"/><text x="705" y="287.5" text-anchor="middle" class="t">Failed</text><rect x="620" y="400" width="170" height="75" rx="4" class="muted"/><text x="705" y="437.5" text-anchor="middle" class="t">Cancelled</text><rect x="300" y="500" width="170" height="65" rx="4" class="warn"/><text x="385" y="532.5" text-anchor="middle" class="t">拒绝：409 / 429</text><path d="M200 260 L300 165" class="line"/><text x="250" y="205.5" text-