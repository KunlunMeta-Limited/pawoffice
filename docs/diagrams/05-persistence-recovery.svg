<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="540" viewBox="0 0 1420 540" role="img" aria-labelledby="title desc"><title id="title">JSONL 事务与重启恢复</title><desc id="desc">AI Office / OpenPaw 架构图预览</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.box{fill:#fff;stroke:#334155;stroke-width:2}.soft{fill:#eff6ff;stroke:#2563eb}.warn{fill:#fff7ed;stroke:#ea580c}.ok{fill:#f0fdf4;stroke:#16a34a}.muted{fill:#f8fafc;stroke:#64748b}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.h{font:700 22px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="38" class="h">JSONL 事务与重启恢复</text><rect x="60" y="130" width="190" height="85" rx="4" class="soft"/><text x="155" y="163.5" text-anchor="middle" class="t">turn_accept_v1</text><text x="155" y="183.5" text-anchor="middle" class="t">requestID + user</text><rect x="330" y="130" width="190" height="85" rx="4" class="box"/><text x="425" y="163.5" text-anchor="middle" class="t">AgentLoop 运行</text><text x="425" y="183.5" text-anchor="middle" class="t">生成消息暂存</text><rect x="600" y="130" width="210" height="85" rx="4" class="warn"/><text x="705" y="163.5" text-anchor="middle" class="t">turn_finish_prepare_v1</text><text x="705" y="183.5" text-anchor="middle" class="t">待提交消息</text><rect x="890" y="130" width="210" height="85" rx="4" class="ok"/><text x="995" y="163.5" text-anchor="middle" class="t">turn_finish_commit_v1</text><text x="995" y="183.5" text-anchor="middle" class="t">唯一提交点</text><rect x="1180" y="130" width="180" height="85" rx="4" class="ok"/><text x="1270" y="163.5" text-anchor="middle" class="t">messages + terminal</text><text x="1270" y="183.5" text-anchor="middle" class="t">对外可见</text><rect x="60" y="350" width="200" height="90" rx="4" class="muted"/><text x="160" y="386" text-anchor="middle" class="t">截断 JSONL 尾部</text><text x="160" y="406" text-anchor="middle" class="t">修复完整记录</text><rect x="330" y="350" width="230" height="90" rx="4" class="soft"/><text x="445" y="386" text-anchor="middle" class="t">Host 启动轻量扫描</text><text x="445" y="406" text-anchor="middle" class="t">全部 session 尾状态</text><rect x="650" y="330" width="230" height="125" rx="4" class="warn"/><text x="765" y="374.5" text-anchor="middle" class="t">prepare 无 commit</text><text x="765" y="394.5" text-anchor="middle" class="t">回滚生成消息</text><text x="765" y="414.5" text-anchor="middle" class="t">闭合 failed</text><rect x="970" y="350" width="210" height="90" rx="4" class="ok"/><text x="1075" y="386" text-anchor="middle" class="t">已有 commit</text><text x="1075" y="406" text-anchor="middle" class="t">恢复消息和 terminal</text><path d="M250 172 L330 172" class="line"/><text x="290" y="165" text-anchor="middle" class="s">接收</text><path d="M520 172 L600 172" class="line"/><text x="560" y="165" text-anchor="middle" class="s">结果</text><path d="M810 172 L890 172" class="line"/><text x="850" y="165" text-anchor="middle" class="s">sync</text><path d="M1100 172 L1180 172" class="line"/><text x="1140" y="165" text-anchor="middle" class="s">发布</text><path d="M260 395 L330 395" class="line"/><text x="295" y="388" text-anchor="middle" class="s">修复</text><path d="M560 385 L650 385" class="line"/><text x="605" y="378" text-anchor="middle" class="s">未 commit</text><path d="M560 405 L970 405" class="line"/><text x="765" y="398" text-anchor="middle" class="s">已 commit</text><path d="M880 370 L1180 215" class="line"/><text x="1030" y="285.5" text-anchor="middle" class="s">failed</text><path d="M1180 395 L1270 215" class="line"/><text x="1225" y="298" text-anchor="middle" class="s">恢复</text></svg>