<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">多会话对话提交流程</title><desc id="desc">AI Office / OpenPaw 架构图预览</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.box{fill:#fff;stroke:#334155;stroke-width:2}.soft{fill:#eff6ff;stroke:#2563eb}.warn{fill:#fff7ed;stroke:#ea580c}.ok{fill:#f0fdf4;stroke:#16a34a}.muted{fill:#f8fafc;stroke:#64748b}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.h{font:700 22px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="38" class="h">多会话对话提交流程</text><rect x="80" y="70" width="160" height="55" rx="4" class="soft"/><text x="160" y="97.5" text-anchor="middle" class="t">用户/React</text><line x1="160" y1="125" x2="160" y2="650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="300" y="70" width="160" height="55" rx="4" class="soft"/><text x="380" y="97.5" text-anchor="middle" class="t">Gateway</text><line x1="380" y1="125" x2="380" y2="650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="520" y="70" width="160" height="55" rx="4" class="soft"/><text x="600" y="97.5" text-anchor="middle" class="t">Host</text><line x1="600" y1="125" x2="600" y2="650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="740" y="70" width="160" height="55" rx="4" class="soft"/><text x="820" y="97.5" text-anchor="middle" class="t">Scheduler</text><line x1="820" y1="125" x2="820" y2="650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="960" y="70" width="160" height="55" rx="4" class="soft"/><text x="1040" y="97.5" text-anchor="middle" class="t">AgentLoop</text><line x1="1040" y1="125" x2="1040" y2="650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="1180" y="70" width="160" height="55" rx="4" class="soft"/><text x="1260" y="97.5" text-anchor="middle" class="t">Provider</text><line x1="1260" y1="125" x2="1260" y2="650" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M160 155 L300 155" class="line"/><text x="230" y="148" text-anchor="middle" class="s">1. POST message + stable requestID</text><path d="M380 205 L520 205" class="line"/><text x="450" y="198" text-anchor="middle" class="s">2. prompt_async 原样转发</text><path d="M680 255 L740 255" class="line"/><text x="710" y="248" text-anchor="middle" class="s">3. admission / 409 / 429</text><path d="M520 305 L160 305" class="line"/><text x="340" y="298" text-anchor="middle" class="s">4. 204 -&gt; 202 接收确认</text><path d="M900 355 L960 355" class="line"/><text x="930" y="348" text-anchor="middle" class="s">5. permit（默认 4/32）</text><path d="M1120 405 L1180 405" class="line"/><text x="1150" y="398" text-anchor="middle" class="s">6. stream / tools / approval</text><path d="M1180 455 L1120 455" class="line"/><text x="1150" y="448" text-anchor="middle" class="s">7. delta + Final</text><path d="M960 505 L680 505" class="line"/><text x="820" y="498" text-anchor="middle" class="s">8. prepare/commit + terminal</text><path d="M160 555 L300 555" class="line"/><text x="230" y="548" text-anchor="middle" class="s">9. 查询 status/messages/turns</text><path d="M380 605 L520 605" class="line"/><text x="450" y="598" text-anchor="middle" class="s">10. 快照读取</text></svg>